# lab/post_campana/filter_apache_sqli.conf
# Filtro Fail2ban para deteccion de inyeccion SQL en logs de Apache (E3 post-campana)
[Definition]
failregex = (?i)^<HOST> - - \[.*\] "(?:GET|POST|HEAD) .*(?:union(?:\s+|%20|\+)(?:all(?:\s+|%20|\+))?select|select(?:\s+|%20|\+).*(?:\s+|%20|\+)from|insert(?:\s+|%20|\+)into|drop(?:\s+|%20|\+)table).* HTTP/\d\.\d" (?:200|404|500)
ignoreregex =
